# APISIX strips the public prefix and supplies X-Forwarded-Prefix.
# Accept path segments only; never reflect an arbitrary redirect target.
map $http_x_forwarded_prefix $public_prefix {
    default "";
    ~^/(?<gateway_prefix>[A-Za-z0-9._~-]+(?:/[A-Za-z0-9._~-]+)*)/?$ /$gateway_prefix;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    autoindex off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    # Biblios assets and search indexes do not all have content-hashed names.
    add_header Cache-Control "no-cache" always;
    add_header Vary "X-Forwarded-Prefix" always;

    # Preserve the external prefix when canonicalising a directory URL.
    location ~ [^/]$ {
        if (-d $request_filename) {
            return 308 $public_prefix$uri/$is_args$args;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
