name: Build and publish documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve latest snapshot metadata
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://jars.sogeo.services/snapshots/guru/interlis/thoth-biblios/0.0.1-SNAPSHOT"
          METADATA_URL="${BASE_URL}/maven-metadata.xml"

          echo "Fetching snapshot metadata: ${METADATA_URL}"
          curl -fsSL "${METADATA_URL}" -o maven-metadata.xml

          TIMESTAMP="$(grep -oPm1 '(?<=<timestamp>)[^<]+' maven-metadata.xml || true)"
          BUILD_NUMBER="$(grep -oPm1 '(?<=<buildNumber>)[^<]+' maven-metadata.xml || true)"

          if [ -z "${TIMESTAMP}" ] || [ -z "${BUILD_NUMBER}" ]; then
            echo "Failed to parse <timestamp> or <buildNumber> from maven-metadata.xml"
            exit 1
          fi

          VERSION="0.0.1-${TIMESTAMP}-${BUILD_NUMBER}"
          JAR_NAME="thoth-biblios-${VERSION}-all.jar"
          JAR_URL="${BASE_URL}/${JAR_NAME}"

          echo "Resolved snapshot version: ${VERSION}"
          echo "Resolved JAR URL: ${JAR_URL}"

          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "jar_url=${JAR_URL}" >> "$GITHUB_OUTPUT"

      - name: Download snapshot JAR
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "${{ steps.snapshot.outputs.jar_url }}" -o "${{ steps.snapshot.outputs.jar_name }}"
          ls -lh "${{ steps.snapshot.outputs.jar_name }}"

      - name: Build HTML documentation site
        shell: bash
        run: |
          set -euo pipefail
          java -jar "${{ steps.snapshot.outputs.jar_name }}" build --config ./biblios.yml
          test -d ./build/site
          test -s ./build/site/index.html

      - name: Build runtime image and test HTTP delivery
        run: |
          docker build -t datenportal-dokumentation:test .
          python3 scripts/test-container.py --image datenportal-dokumentation:test

      - name: Upload tested HTML for container publishing
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: build/site/
          if-no-files-found: error
          retention-days: 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/site/

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-container:
    name: Publish static documentation image
    needs: build-site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download tested HTML
        uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: build/site

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/sogis/datenportal-dokumentation
            sogis/datenportal-dokumentation
          tags: |
            type=sha
            type=raw,value=0.1.${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push images
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Documentation container'
            echo
            echo 'Images: ghcr.io/sogis/datenportal-dokumentation and docker.io/sogis/datenportal-dokumentation'
            echo "Digest: $IMAGE_DIGEST"
            echo
            echo 'Tags:'
            echo "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check anonymous image access
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          # A fresh Docker config deliberately contains no registry credentials.
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          for image in ghcr.io/sogis/datenportal-dokumentation docker.io/sogis/datenportal-dokumentation; do
            if docker --config "$anonymous_config" pull "$image@$IMAGE_DIGEST"; then
              echo "Anonymous pull ($image): successful." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Anonymous pull failed for $image. Check public visibility and registry availability; see README."
              echo "Anonymous pull ($image): failed. Check public visibility and registry availability." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
