site:
  title: "Datenportal: Dokumentation"
  url: https://daten.so.ch/dokumentation
  default_language: de

output:
  dir: build/site
  clean: true

ui:
  theme: default
  show_version_badge: false
  show_edit_link: true
  show_source_link: true
  syntax_highlighting: prism
  version_switch_mode: start_page
  search_language_mode: multilingual_safe
  sidebar_toc_depth: 2
  content_toc: off
  content_section_numbers: on
  content_section_number_depth: 3
  # Bei Bedarf auf die tatsächliche Codeberg-/GitLab-/GitHub-URL anpassen.
  #edit_url_pattern: "{repo_url}/_edit/{branch}/{path}"
  #source_url_pattern: "{repo_url}/src/branch/{branch}/{path}"

content:
  groups:
    - title: Benutzer
      sources: [datenintegration, glossar]
    - title: Themenintegrator
      sources: [themenrepo]
    - title: Betreiber
      sources: [architektur, betrieb]
  sources:
    - id: glossar
      display_name: Glossar
      card_label: Alle
      #card_background_color: "#E8F1FF"
      url: https://codeberg.org/edigonzales/datenportal-dokumentation-glossar.git
      branches:
        - name: main
          display_version: Aktuell
      start_path: docs/biblios
      default_version: main
      render_mode: single_page
      master_file: master.adoc
      sidebar_toc_numbers: on

    - id: architektur
      display_name: Architektur und Zusammenspiel
      card_label: Betrieb, Themenintegration, Entwicklung
      url: https://github.com/sogis/datenportal-dokumentation-architektur.git
      branches:
        - name: main
          display_version: Aktuell
      start_path: docs/biblios
      default_version: main
      render_mode: single_page
      master_file: master.adoc
      sidebar_toc_numbers: on

    - id: datenintegration
      display_name: Datenintegration
      card_label: Datenlieferant
      url: https://codeberg.org/edigonzales/datenportal-dokumentation-datenintegration.git
      branches:
        - name: main
          display_version: Aktuell
      start_path: docs/biblios
      default_version: main
      render_mode: single_page
      master_file: master.adoc
      sidebar_toc_numbers: on

    - id: betrieb
      display_name: Betrieb
      card_label: Administration
      url: https://codeberg.org/edigonzales/datenportal-dokumentation-betrieb.git
      branches:
        - name: main
          display_version: Aktuell
      start_path: docs/biblios
      default_version: main
      render_mode: single_page
      master_file: master.adoc
      sidebar_toc_numbers: on

    - id: themenrepo
      display_name: Themenrepo
      card_label: Themenintegrator
      url: https://codeberg.org/edigonzales/datenportal-themenrepo.git
      branches:
        - name: main
          display_version: Aktuell
      start_path: docs/biblios
      default_version: main
      render_mode: single_page
      master_file: index.adoc
      sidebar_toc_numbers: on

